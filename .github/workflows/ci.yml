name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy src config
      - name: Unit + integration tests
        run: pytest -v
        env:
          LLM_PROVIDER: mock
          DB_BACKEND: sqlite

  # Security scanning, golden evaluation, container build, and deployment
  # gates are added as those phases land — see progress.md.

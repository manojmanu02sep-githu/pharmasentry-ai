[project]
name = "pharmasentry-ai"
version = "0.1.0"
description = "Bounded, goal-driven multi-agent pharmacovigilance intake prototype (educational, synthetic data only)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: this codebase deliberately uses `class X(str, Enum)` (not StrEnum) so
# every enum stays a plain str for logging/serialization compatibility.
ignore = ["UP042"]

[tool.mypy]
# Deliberately NOT pinned to the project's minimum supported Python
# (3.11, see requires-python above): numpy's bundled stubs (reached
# transitively via rank-bm25/pymupdf, never imported directly) use
# Python 3.12 "type" statements mypy cannot parse under python_version
# 3.11. Leaving this unset lets mypy use the interpreter it's actually
# running under (3.14 in this environment), which parses those stubs
# fine; it does not change what language features our own code may use.
packages = ["src", "config", "scripts"]
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
